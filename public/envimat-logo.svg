<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 90" role="img" aria-label="ENVIMAT — Environment and Material Handling">
  <!-- Assinatura completa da ENVIMAT, fiel ao manual da marca 2026: wordmark com
       corte diagonal no E + bloco tipográfico de apoio. Versão sobre fundo claro. -->
  <g>
    <!-- Símbolo: E com corte diagonal (assinatura gráfica) -->
    <path d="M8 14 H62 L74 0 H96 V76 H20 L8 90 Z" fill="#086830"/>
    <path d="M30 22 H80 V34 H44 V42 H74 V54 H44 V64 H82 V76 H30 Z" fill="#ffffff"/>
