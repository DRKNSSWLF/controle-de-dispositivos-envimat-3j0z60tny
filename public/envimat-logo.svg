    <text x="112" y="50"
          font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
          font-size="40" font-weight="700" letter-spacing="6"
          fill="#0A4421">ENVIMAT</text>
    <!-- Bloco de apoio -->
    <text x="113" y="70"
          font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
          font-size="11" font-weight="500" letter-spacing="1.4"
          fill="#5b6b62">Environment &amp; Material Handling</text>
  </g>
</svg>
